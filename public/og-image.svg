    <path d="M34 38c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10 10-10-4.477-10-10zm16 0a6 6 0 1 0-12 0 6 6 0 0 0 12 0z" fill="url(#q)"/>
