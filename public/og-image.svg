      <stop offset="0" stop-color="#05060f"/>
      <stop offset="0.55" stop-color="#0a0b1e"/>
      <stop offset="1" stop-color="#11132e"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0.15" cy="0.2" r="0.4">
