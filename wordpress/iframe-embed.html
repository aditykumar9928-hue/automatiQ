<!--
  AutomatiQ — WordPress iframe embed (full website)
  ===================================================
  HOW TO USE:
  1. In Bolt, click "Publish" (top-right). Bolt gives you a live URL
     that looks like:  https://your-site.bolt.host
  2. Copy that URL.
  3. Below, replace  PASTE_YOUR_BOLT_URL  with your real published URL.
  4. In WordPress: edit a page → add a "Custom HTML" block → paste everything
     from <div> through </div> below → Save / Update.
-->

<div style="width:100%;height:100vh;overflow:hidden;border:0;">
  <iframe
    src="PASTE_YOUR_BOLT_URL"
    title="AutomatiQ — AI Automation Agency"
    loading="lazy"
    style="width:100%;height:100%;border:0;display:block;"
    allow="clipboard-write; autoplay; fullscreen"
    allowfullscreen
  ></iframe>
</div>
